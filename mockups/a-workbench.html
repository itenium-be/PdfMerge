<meta charset="utf-8">
<title>PDF Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">
<style>
.work { display: grid; grid-template-columns: minmax(0, 1fr) 296px; flex: 1; min-height: 0; }
.canvas { padding: 16px 18px 110px; display: flex; flex-direction: column; gap: 14px; align-content: start; }

/* One canvas, cut into outputs: the band tells you which file you are looking at. */
.output { border: 1px solid var(--rule-2); border-radius: 10px; overflow: hidden; }
.output[data-alt='1'] { background: var(--sunk); }
.output .cut { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--rule-2); }
.output .cut .tag { display: inline-flex; align-items: center; gap: 7px; font: 500 10.5px/1 var(--mono); letter-spacing: .08em;
  text-transform: uppercase; color: var(--accent); }
.output .cut .range { font: 400 11px var(--mono); color: var(--ink-3); }
.output .cut .grow { flex: 1; }
.output .cut .btn { height: 27px; font-size: 11.5px; padding: 0 9px; }
.output .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 14px 12px; padding: 14px 12px; }

.pcard { position: relative; border: 1px solid var(--rule-2); border-radius: 7px; background: var(--surface); padding: 7px 7px 6px; cursor: grab; }
.pcard:hover { border-color: var(--ink-3); }
.pcard[data-sel='1'] { border-color: var(--sel); box-shadow: 0 0 0 2px color-mix(in srgb, var(--sel) 22%, transparent); }
.pcard[data-focus='1'] { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.pcard.dragging { opacity: .3; }
.pcard.dropbefore::before { content: ''; position: absolute; left: -7px; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--sel); }
.pcard .frame { position: relative; overflow: hidden; border-radius: 3px; box-shadow: 0 1px 3px rgb(21 22 27 / .18); }
.pcard .frame .sheet { transition: transform .18s; }

.pcard .cap { margin-top: 7px; font: 400 10.5px/1.35 var(--mono); color: var(--ink-3); }
.pcard .cap .file { display: flex; align-items: center; gap: 5px; color: var(--ink-2); }
.pcard .cap .file .dot { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.pcard .cap .file b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .cap .orig { display: flex; justify-content: space-between; gap: 6px; }
.pcard .cap .orig .seq { color: var(--ink-2); font-weight: 600; }

.psel { position: absolute; top: 12px; left: 12px; width: 15px; height: 15px; accent-color: var(--sel); opacity: 0; }
.pcard:hover .psel, .pcard[data-sel='1'] .psel { opacity: 1; }
.ptools { position: absolute; top: 10px; right: 10px; display: flex; gap: 3px; opacity: 0; transition: opacity .12s; }
.pcard:hover .ptools { opacity: 1; }
.ptools button { width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--rule);
  border-radius: 5px; background: var(--surface); color: var(--ink-2); padding: 0; }
.ptools button:hover { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.ptools button.rm:hover { background: #C4351F; border-color: #C4351F; color: #fff; }
.ptools svg { width: 13px; height: 13px; }

.cutbtn { position: absolute; left: -11px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 50%;
  border: 1px dashed var(--rule); background: var(--surface); color: var(--ink-3); display: grid; place-items: center; padding: 0; opacity: 0; z-index: 2; }
.pcard:hover .cutbtn { opacity: 1; }
.cutbtn:hover { border: 1px solid var(--accent); color: var(--accent); }
.cutbtn svg { width: 12px; height: 12px; }

/* Right rail: what a page is, where it came from, what can be done to it. */
.aside { border-left: 1px solid var(--rule); padding: 18px 18px 24px; overflow-y: auto; }
.aside .sticky { position: sticky; top: 18px; display: flex; flex-direction: column; gap: 12px; }
.stage { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); padding: 14px;
  background-image: linear-gradient(var(--rule-2) 1px, transparent 1px), linear-gradient(90deg, var(--rule-2) 1px, transparent 1px);
  background-size: 8px 8px; }
.stage .sheet { box-shadow: 0 2px 10px rgb(21 22 27 / .2); border-radius: 3px; }
.aside h3 { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
.sum { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 12px; margin: 0; font: 400 11.5px/1.4 var(--mono); color: var(--ink-3); }
.sum dd { margin: 0; color: var(--ink-2); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.acts .btn { width: 100%; }
.acts .wide { grid-column: 1 / -1; }
.aside .empty { color: var(--ink-3); font-size: 12.5px; }
.outsum { display: flex; flex-direction: column; gap: 7px; }
.outsum .row { display: flex; align-items: center; gap: 9px; border: 1px solid var(--rule-2); border-radius: 7px; padding: 8px 10px; font-size: 12.5px; }
.outsum .row .mono { margin-left: auto; font-size: 10.5px; color: var(--ink-3); }
.selist { display: flex; flex-wrap: wrap; gap: 4px; }
.selist span { font: 400 10.5px var(--mono); border: 1px solid var(--rule-2); border-radius: 4px; padding: 2px 6px; color: var(--ink-2); }

.actionbar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center;
  max-width: calc(100vw - 24px); align-items: center; gap: 8px; background: var(--ink); color: var(--surface); border-radius: 9px;
  padding: 8px 8px 8px 16px; box-shadow: 0 10px 30px rgb(21 22 27 / .3); }
.actionbar[hidden] { display: none; }
.actionbar .n { font: 500 12.5px var(--mono); margin-right: 6px; }
.actionbar .btn { border-color: color-mix(in srgb, var(--surface) 35%, transparent); background: 0; color: inherit; }
.actionbar .btn:hover { background: color-mix(in srgb, var(--surface) 15%, transparent); }
.actionbar .close { border: 0; background: 0; color: inherit; opacity: .6; width: 28px; }

.dropzone { border: 1.5px dashed var(--rule); border-radius: 9px; padding: 16px; text-align: center; color: var(--ink-3); font-size: 12.5px; }
.dropzone b { color: var(--ink-2); font-weight: 500; }
.stat { font: 400 11.5px var(--mono); color: var(--ink-3); }
.stat b { color: var(--ink-2); font-weight: 600; }

@media (max-width: 900px) {
  .work { grid-template-columns: 1fr; }
  .aside { border-left: 0; border-top: 1px solid var(--rule); }
  .aside .sticky { position: static; }
  .output .pgrid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
}
</style>

<div class="shell">
  <header class="appbar">
    <div class="wordmark" data-wordmark></div>
    <span class="stat"><b id="pcount">0</b> pages</span>
    <span class="grow"></span>
    <button class="btn btn-ghost btn-sm">Undo</button>
    <button class="btn btn-ghost btn-sm" disabled>Redo</button>
    <button class="btn btn-ghost btn-sm">Add files</button>
    <button class="btn btn-ghost btn-sm btn-icon" data-theme-toggle></button>
  </header>

  <div class="work">
    <div class="canvas" id="canvas"></div>
    <aside class="aside"><div class="sticky" id="detail"></div></aside>
  </div>

  <div class="actionbar" id="actionbar" hidden>
    <span class="n"><span id="selcount">0</span> selected</span>
    <button class="btn btn-sm" data-bulk="rotate">Rotate</button>
    <button class="btn btn-sm" data-bulk="extract">Extract to new PDF</button>
    <button class="btn btn-sm" data-bulk="delete">Delete</button>
    <button class="close" id="clearsel" aria-label="Clear selection">✕</button>
  </div>

  <footer class="footer" data-footer></footer>
</div>

<script src="_shared.js"></script>
<script>
const DOCS = [
  { name: 'Q3-invoices.pdf', color: '#E78200', kind: 'invoice', pages: 6 },
  { name: 'Service-agreement.pdf', color: '#2B4BF2', kind: 'contract', pages: 5 },
  { name: 'Signed-page-4.pdf', color: '#12A594', kind: 'scan', pages: 1 },
  { name: 'Board-deck.pdf', color: '#B5297A', kind: 'report', pages: 4 },
]
const SIZES = ['A4 · 210 × 297 mm', 'A4 · 210 × 297 mm', 'Letter · 216 × 279 mm', 'A4 landscape · 297 × 210 mm']

let pages = DOCS.flatMap((d, di) => Array.from({ length: d.pages }, (_, pi) => ({
  doc: di, orig: pi + 1, rot: 0, sel: false, cut: false,
})))
pages[6].cut = true
let focused = 6

const ROT_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 9h-9a5 5 0 0 0 0 10h4"/><path d="m18 6 3 3-3 3"/></svg>'
const ROT_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9h9a5 5 0 0 1 0 10H8"/><path d="M6 6 3 9l3 3"/></svg>'
const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'
const CUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="18" r="2.5"/><circle cx="6" cy="6" r="2.5"/><path d="M8 8l12 10M8 16 20 6"/></svg>'

const outputs = () => {
  const out = []
  pages.forEach((p, i) => {
    if (i === 0 || p.cut) out.push({ start: i, items: [] })
    out[out.length - 1].items.push({ p, i })
  })
  return out
}

function card(p, i) {
  const d = DOCS[p.doc]
  return `<article class="pcard" draggable="true" data-i="${i}" data-sel="${p.sel ? 1 : 0}" data-focus="${focused === i ? 1 : 0}">
    <button class="cutbtn" data-cut="${i}" title="Split before this page">${CUT}</button>
    <input class="psel" type="checkbox" data-selbox="${i}" ${p.sel ? 'checked' : ''} aria-label="Select page ${i + 1}">
    <div class="ptools">
      <button data-rot="${i}" title="Rotate right">${ROT_R}</button>
      <button class="rm" data-del="${i}" title="Remove this page" aria-label="Remove page ${i + 1}">${X}</button>
    </div>
    <div class="frame">${sheet(d.kind, p.orig).replace('class="sheet"', 'class="sheet" style="transform:rotate(' + p.rot + 'deg)"')}</div>
    <div class="cap">
      <span class="file"><span class="dot" style="background:${d.color}"></span><b>${d.name}</b></span>
      <span class="orig">page ${p.orig}<span class="seq">#${i + 1}</span></span>
    </div>
  </article>`
}

function render() {
  const outs = outputs()
  document.getElementById('canvas').innerHTML = outs.map((o, oi) => {
    const last = o.items[o.items.length - 1].i + 1
    return `<section class="output" data-alt="${oi % 2}">
      <div class="cut">
        <span class="tag">${CUT} Output ${oi + 1}</span>
        <span class="range">pages ${o.start + 1}–${last} · ${o.items.length} pages</span>
        <span class="grow"></span>
        ${oi > 0 ? `<button class="btn btn-ghost btn-sm" data-uncut="${o.start}">Remove split</button>` : ''}
        <button class="btn btn-accent btn-sm" data-dl="${oi}">Download PDF</button>
      </div>
      <div class="pgrid">${o.items.map(({ p, i }) => card(p, i)).join('')}</div>
    </section>`
  }).join('') + '<div class="dropzone">Drop more PDFs here — or <b>paste</b> a page to slot it in</div>'

  document.getElementById('pcount').textContent = pages.length
  const sel = pages.filter(p => p.sel).length
  document.getElementById('selcount').textContent = sel
  document.getElementById('actionbar').hidden = sel < 2
  renderDetail()
}

function renderDetail() {
  const el = document.getElementById('detail')
  const sel = pages.map((p, i) => ({ p, i })).filter(x => x.p.sel)
  const outs = outputs()
  const outOf = i => outs.findIndex(o => o.items.some(x => x.i === i)) + 1

  if (sel.length > 1) {
    el.innerHTML = `<p class="eyebrow">Selection</p><h3>${sel.length} pages selected</h3>
      <div class="selist">${sel.map(x => `<span>${x.i + 1}</span>`).join('')}</div>
      <div class="acts">
        <button class="btn btn-sm" data-bulk="rotate">Rotate</button>
        <button class="btn btn-sm" data-bulk="extract">Extract</button>
        <button class="btn btn-sm wide" data-bulk="delete">Remove ${sel.length} pages</button>
      </div>
      <p class="hint">Drag any selected page to move all ${sel.length} together.</p>`
    return
  }

  const i = focused
  const p = pages[i]
  if (!p) {
    el.innerHTML = `<p class="eyebrow">Outputs</p><h3>${outs.length} file${outs.length > 1 ? 's' : ''} out</h3>
      <div class="outsum">${outs.map((o, oi) => `<div class="row">Output ${oi + 1}<span class="mono">${o.items.length} pages</span></div>`).join('')}</div>
      <p class="empty">Click a page to see where it came from.</p>`
    return
  }

  const d = DOCS[p.doc]
  el.innerHTML = `
    <p class="eyebrow">Page ${i + 1} of ${pages.length}</p>
    <div class="stage">${sheet(d.kind, p.orig).replace('class="sheet"', 'class="sheet" style="transform:rotate(' + p.rot + 'deg)"')}</div>
    <h3>${d.name}</h3>
    <dl class="sum">
      <dt>original page</dt><dd>${p.orig} of ${d.pages}</dd>
      <dt>position</dt><dd>${i + 1}</dd>
      <dt>output</dt><dd>Output ${outOf(i)}</dd>
      <dt>size</dt><dd>${SIZES[p.doc]}</dd>
      <dt>rotation</dt><dd>${((p.rot % 360) + 360) % 360}°</dd>
    </dl>
    <div class="acts">
      <button class="btn btn-sm" data-rotl="${i}">${ROT_L} Left</button>
      <button class="btn btn-sm" data-rot="${i}">${ROT_R} Right</button>
      <button class="btn btn-sm wide">Replace with another page…</button>
      <button class="btn btn-sm wide" data-cut="${i}">Split before this page</button>
      <button class="btn btn-sm wide" data-del="${i}">Remove page</button>
    </div>`
}

document.body.addEventListener('click', e => {
  const t = e.target.closest('[data-rot],[data-rotl],[data-del],[data-cut],[data-uncut],[data-selbox],[data-bulk],[data-dl]')
  if (t) {
    if (t.dataset.rot !== undefined) pages[t.dataset.rot].rot += 90
    if (t.dataset.rotl !== undefined) pages[t.dataset.rotl].rot -= 90
    if (t.dataset.del !== undefined) {
      const i = +t.dataset.del
      if (pages[i].cut && pages[i + 1]) pages[i + 1].cut = true
      pages.splice(i, 1)
      if (focused >= pages.length) focused = pages.length - 1
    }
    if (t.dataset.cut !== undefined) pages[t.dataset.cut].cut = true
    if (t.dataset.uncut !== undefined) pages[t.dataset.uncut].cut = false
    if (t.dataset.selbox !== undefined) { pages[t.dataset.selbox].sel = t.checked; focused = +t.dataset.selbox }
    if (t.dataset.bulk === 'rotate') pages.forEach(p => { if (p.sel) p.rot += 90 })
    if (t.dataset.bulk === 'delete') pages = pages.filter(p => !p.sel)
    if (t.dataset.bulk === 'extract') {
      const first = pages.findIndex(p => p.sel)
      if (first > 0) pages[first].cut = true
      pages.forEach(p => p.sel = false)
    }
    return render()
  }
  const card = e.target.closest('.pcard')
  if (card) {
    const i = +card.dataset.i
    focused = i
    if (e.shiftKey || e.ctrlKey || e.metaKey) pages[i].sel = !pages[i].sel
    render()
  }
})

document.getElementById('clearsel').addEventListener('click', () => { pages.forEach(p => p.sel = false); render() })

let dragFrom = null
const canvas = document.getElementById('canvas')
canvas.addEventListener('dragstart', e => {
  const card = e.target.closest('.pcard')
  if (!card) return
  dragFrom = +card.dataset.i
  card.classList.add('dragging')
})
canvas.addEventListener('dragover', e => {
  e.preventDefault()
  canvas.querySelectorAll('.dropbefore').forEach(c => c.classList.remove('dropbefore'))
  const card = e.target.closest('.pcard')
  if (card) card.classList.add('dropbefore')
})
canvas.addEventListener('drop', e => {
  e.preventDefault()
  const card = e.target.closest('.pcard')
  if (dragFrom === null || !card) return
  const target = pages[+card.dataset.i]
  /* Dragging one of the selected pages carries the whole selection; dragging any other page moves just it. */
  const moving = pages[dragFrom].sel ? pages.filter(p => p.sel) : [pages[dragFrom]]
  if (moving.includes(target)) return
  const cutAt = moving[0].cut && moving[0] === pages[0] ? false : moving[0].cut
  pages = pages.filter(p => !moving.includes(p))
  const at = pages.indexOf(target)
  moving.forEach(p => p.cut = false)
  if (cutAt && at > 0) moving[0].cut = true
  pages.splice(at, 0, ...moving)
  if (pages[0]) pages[0].cut = false
  focused = pages.indexOf(moving[0])
  dragFrom = null
  render()
})
canvas.addEventListener('dragend', () => {
  canvas.querySelectorAll('.dropbefore,.dragging').forEach(c => c.classList.remove('dropbefore', 'dragging'))
})

mountChrome('PDF Workbench', 'by itenium')
render()
</script>
